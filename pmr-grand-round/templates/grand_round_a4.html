<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  @page {
    size: A4 portrait;
    margin: 9mm 10.5mm 9mm 10.5mm;
  }
  * {
    box-sizing: border-box;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, 'Sukhumvit Set', 'Thonburi', 'Helvetica Neue', Arial, sans-serif;
    font-size: 8.8pt;
    line-height: 1.38;
    color: #1E293B;
    background: #FFFFFF;
  }
  .page {
    page-break-after: always;
    display: flex;
    flex-direction: column;
    min-height: 276mm;
  }
  .page:last-child {
    page-break-after: auto;
  }
  .hero {
    background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 65%, #0D9488 100%);
    color: #FFFFFF;
    padding: 13px 16px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 6px solid #2DD4BF;
  }
  .hero-kicker {
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: #99F6E4;
    margin-bottom: 2px;
  }
  .hero-title {
    font-size: 16pt;
    font-weight: 800;
    margin: 0 0 3px 0;
    line-height: 1.2;
  }
  .hero-sub {
    font-size: 8.5pt;
    color: #E2E8F0;
    margin: 0;
  }
  .page-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0F172A;
    color: #FFFFFF;
    padding: 6.5px 12px;
    border-radius: 7px;
    margin-bottom: 8px;
    border-left: 5px solid #14B8A6;
  }
  .page-banner .pb-title { font-size: 10.6pt; font-weight: 700; }
  .page-banner .pb-tag {
    font-size: 7.4pt;
    background: #0D9488;
    color: #FFFFFF;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 700;
  }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 10.1pt;
    font-weight: 800;
    color: #0F172A;
    border-bottom: 2px solid #0D9488;
    padding-bottom: 2px;
    margin: 7px 0 5px 0;
  }
  .sec-num {
    background: #0D9488;
    color: #FFFFFF;
    font-size: 7.8pt;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 4px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 7px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-bottom: 7px; }
  .card { background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 7px; padding: 7px 9px; }
  .card-navy { background: #F0FDFA; border: 1px solid #5EEAD4; border-left: 4px solid #0D9488; border-radius: 7px; padding: 7px 9px; }
  .card-alert { background: #FFF7ED; border: 1px solid #FDBA74; border-left: 4px solid #EA580C; border-radius: 7px; padding: 7px 9px; }
  .card-dark { background: #0F172A; color: #F8FAFC; border-radius: 7px; padding: 7px 10px; }
  .card-title { font-size: 9pt; font-weight: 800; color: #0F172A; margin: 0 0 3.5px 0; }
  .card-dark .card-title { color: #5EEAD4; }
  .card-alert .card-title { color: #9A3412; }
  ul { margin: 0; padding-left: 15px; }
  li { margin-bottom: 2.2px; }
  .tight li { margin-bottom: 1.6px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 8.15pt; line-height: 1.33; }
  th { background: #0F172A; color: #FFFFFF; text-align: left; padding: 4.5px 6px; font-weight: 700; border: 1px solid #1E293B; }
  td { padding: 4px 6px; border: 1px solid #CBD5E1; vertical-align: top; }
  tr:nth-child(even) td { background: #F8FAFC; }
  .highlight-col { background: #F0FDFA !important; }
  .badge { display: inline-block; padding: 0.5px 5px; border-radius: 4px; font-size: 7.3pt; font-weight: 700; }
  .b-teal { background: #CCFBF1; color: #0F766E; }
  .b-navy { background: #E2E8F0; color: #0F172A; }
  .b-warn { background: #FFEDD5; color: #9A3412; }
  .b-red  { background: #FEE2E2; color: #991B1B; }
  .formula { font-family: 'SF Mono', Menlo, monospace; font-size: 8pt; font-weight: 700; background: #CCFBF1; color: #0F766E; padding: 1px 4px; border-radius: 3px; }
  .trap-tag { display: inline-block; background: #FEF3C7; color: #92400E; border: 1px solid #F59E0B; font-size: 7.1pt; font-weight: 700; padding: 0px 4px; border-radius: 3px; }
  .footer-note { margin-top: auto; font-size: 7.2pt; color: #64748B; border-top: 1px solid #CBD5E1; padding-top: 4px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<!-- Populate .page blocks here -->
</body>
</html>
